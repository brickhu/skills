name: Recipe Gallery

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'recipe', color: '1d76db', description: 'db-ops recipe submission' },
              { name: 'approved', color: '0e8a16', description: 'reviewed and accepted into the gallery' },
              { name: 'rejected', color: 'b60205', description: 'not accepted — see issue comments' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.getLabel({ ...context.repo, name: l.name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ ...context.repo, ...l });
                }
              }
            }

  collect:
    needs: ensure-labels
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract recipes from approved issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const galleryUrl = `https://github.com/${owner}/${repo}/tree/main/recipes`;

            function escapeRegExp(s) {
              return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }
            // issue-form answers render as "### <label>\n\n<answer>" sections
            function section(body, label) {
              const re = new RegExp('###\\s*' + escapeRegExp(label) + '\\s*\\n([\\s\\S]*?)(?=\\n###\\s|$)', 'i');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            }
            function csv(text) {
              return String(text || '').split(/[,，\n]/).map((s) => s.trim()).filter(Boolean);
            }
            function checkboxes(body, label) {
              const s = section(body, label);
              return (s.match(/^\s*- \[x\]\s*(.+)$/gim) || []).map((l) => l.replace(/^\s*- \[x\]\s*/, '').trim());
            }
            function parseForm(body) {
              const name = section(body, 'Recipe name');
              if (!name) return null;
              return {
                name,
                description: section(body, 'What does it do?'),
                tags: csv(section(body, 'Tags')),
                connection: section(body, 'Connection placeholder') || 'YOUR_DB',
                triggers: csv(section(body, 'Trigger phrases')),
                prompt: section(body, 'Workflow prompt'),
                danger: section(body, 'Danger level') === 'true (dangerous)',
                _meta: {
                  author: section(body, 'Author') || 'community',
                  databases: checkboxes(body, 'Target databases')
                }
              };
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'recipe,approved'
            });

            let processed = 0;
            for (const issue of issues) {
              const body = issue.body || '';
              let data = null;

              // legacy: a JSON code block pasted in the body
              const match = body.match(/```(?:json)?\s*([\s\S]*?)```/);
              if (match) {
                try {
                  const parsed = JSON.parse(match[1]);
                  if (parsed && parsed.name && parsed.prompt) data = parsed;
                } catch (e) { /* fall through to form parsing */ }
              }

              // form-based: assemble the recipe from the form fields
              if (!data) data = parseForm(body);

              if (!data || !data.name || !data.prompt || !Array.isArray(data.triggers) || data.triggers.length === 0) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: '❌ 缺少必填字段 / Missing required fields: name, triggers, prompt. 请补全表单后重新打开该 issue。'
                });
                continue;
              }

              const slug = String(data.name).toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '') || 'recipe';
              data._meta = { ...(data._meta || {}), source_issue: issue.number, added: new Date().toISOString().slice(0, 10) };
              fs.writeFileSync(`recipes/${slug}.json`, JSON.stringify(data, null, 2) + '\n');
              processed++;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `✅ Recipe \`${data.name}\` 已收录到 [Recipe Gallery](${galleryUrl}) — 感谢分享！`
              });
            }
            core.info(`Processed ${processed} recipe issue(s)`);

      - name: Rebuild gallery page
        run: node .github/scripts/build-gallery.mjs

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update recipe gallery"
          commit_author_name: "github-actions[bot]"
          commit_author_email: "41898282+github-actions[bot]@users.noreply.github.com"
