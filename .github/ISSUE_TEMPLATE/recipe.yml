name: Recipe submission
description: Share a db-ops recipe with the community — fully form-based, no JSON to write
title: "New recipe: {{ name }}"
labels: ["recipe"]
body:
  - type: input
    id: name
    attributes:
      label: Recipe name
      description: "Short, lowercase, hyphenated. Example: invite-code"
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: What does it do?
      description: One or two plain-language sentences about the workflow.
      placeholder: Generate a coupon code and insert it into the coupons table
    validations:
      required: true
  - type: input
    id: triggers
    attributes:
      label: Trigger phrases
      description: "Comma-separated, any language. Example: add invite code, generate invite code, 生成邀请码"
    validations:
      required: true
  - type: input
    id: prompt
    attributes:
      label: Workflow prompt
      description: "The natural-language workflow the agent executes. Template variables go in angle brackets, e.g. <code> — users fill them in from chat. One line is enough."
      placeholder: "Run pnpm invites:create <code> to generate an invite code (workdir services/api), then verify it with SQL"
    validations:
      required: true
  - type: dropdown
    id: databases
    attributes:
      label: Target databases
      description: Select all that apply.
      multiple: true
      options:
        - postgres
        - mysql
        - sqlite
        - any
  - type: dropdown
    id: danger
    attributes:
      label: Danger level
      description: Does this recipe perform dangerous operations (DELETE / UPDATE / DROP ...)?
      options:
        - "false (safe)"
        - "true (dangerous)"
  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Comma-separated, optional. Example: invite, growth"
  - type: input
    id: author
    attributes:
      label: Author
      description: Your GitHub username or nickname, optional.
  - type: input
    id: connection
    attributes:
      label: Connection placeholder
      description: "Optional, defaults to YOUR_DB. Users bind it to their own connection when importing."
